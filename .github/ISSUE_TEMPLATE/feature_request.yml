name: Feature request
description: Suggest a change or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like OpenMail to handle it. Mention another mail app if it does this well.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
