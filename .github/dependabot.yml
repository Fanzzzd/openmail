version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # electron-vite 5 supports only vite 5 to 7 (AGENTS.md). Lift this when
      # electron-vite ships a release that accepts vite 8.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # plugin-react 6 requires vite 8 and drops the babel option the Lingui
      # macro and React Compiler run through. Moves together with vite.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships only the native compiler and no JS compiler API.
      # Next.js, Expo's config loader and cosmiconfig still call that API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types follow the oldest Node we run on (engines: node >=22.13).
      # Newer majors type APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The mobile app stays on Expo SDK 57 for now. An SDK major brings its own React Native
      # release (SDK 57 is RN 0.86), moves every expo-* package together and invalidates the
      # version-bound patches in patches/ (docs/dependency-patches.md). That upgrade runs
      # through `npx expo install --fix` and a native rebuild, not a Dependabot bump.
      # Patch and minor updates inside SDK 57 still come through the expo group.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      # React Native is 0.x, so each minor (0.86 to 0.87) is the breaking step that follows
      # an Expo SDK major. The native libraries are pinned to the versions the SDK lists in
      # expo/bundledNativeModules.json. Only patches come through.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The React Native renderer refuses any React other than the one it was built with, and
      # the mobile app pins that one (19.2.3 for RN 0.86). Dependabot cannot scope a rule to
      # apps/mobile, so React minors for desktop and docs are bumped by hand; patches still
      # come through.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Effect packages share one release train and must move together.
      effect:
        patterns: ["effect", "@effect/*"]
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*", "@react-native/*"]
      lingui:
        patterns: ["@lingui/*"]
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
