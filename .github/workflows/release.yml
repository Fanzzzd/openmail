name: Release

# Builds the macOS DMG and ZIP for arm64 and x64 and attaches them to a GitHub Release.
# With the Apple secrets the build is Developer ID signed and notarized. Without them it is
# ad-hoc signed and the release is marked as a prerelease. See docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"

jobs:
  # The same build, type, test, lint and format checks as a push to main. Nothing is
  # built for release, and no secret is in scope, until they pass on this commit.
  check:
    uses: ./.github/workflows/check.yml

  # The 100k-message query and insert budgets (docs/performance.md) on the same commit.
  perf:
    uses: ./.github/workflows/perf.yml

  release:
    needs: [check, perf]
    runs-on: macos-latest
    permissions:
      contents: write
      # Build provenance attestations: an OIDC token to sign them, and the right to store them.
      id-token: write
      attestations: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh uploads with GH_TOKEN; git needs no stored credential.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in the next step; the store is cached below.
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: corepack enable

      - name: Check the tag matches the app version
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi

      # Icon Composer's actool compiles build/icon.icon and needs Xcode 26.
      - name: Select Xcode 26
        run: |
          xcode=""
          for app in /Applications/Xcode_26*.app; do [ -d "$app" ] && xcode="$app"; done
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq 'Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Packaging needs Xcode 26 or later"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Decide signed or unsigned
        id: mode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are missing. Building an unsigned prerelease."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and notarize
        if: steps.mode.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENMAIL_GOOGLE_CLIENT_ID: ${{ secrets.OPENMAIL_GOOGLE_CLIENT_ID }}
          OPENMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OPENMAIL_GOOGLE_CLIENT_SECRET }}
          OPENMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.OPENMAIL_MICROSOFT_CLIENT_ID }}
        run: pnpm --filter @openmail/desktop dist:signed

      - name: Build unsigned
        if: steps.mode.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          OPENMAIL_GOOGLE_CLIENT_ID: ${{ secrets.OPENMAIL_GOOGLE_CLIENT_ID }}
          OPENMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OPENMAIL_GOOGLE_CLIENT_SECRET }}
          OPENMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.OPENMAIL_MICROSOFT_CLIENT_ID }}
        run: pnpm --filter @openmail/desktop dist

      # The x64 app runs under Rosetta on the arm64 runner. Both builds must launch.
      - name: Install Rosetta
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::The release runner must be arm64 so it can launch both builds"
            exit 1
          fi
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      # Each launch uses new temporary profiles with no accounts. scripts/smoke-dist.mjs checks
      # the fuses, that ELECTRON_RUN_AS_NODE is ignored, `OpenMail --mcp` over stdio with the
      # read-only tool set, and the GUI start. A failure stops the job before anything is uploaded.
      - name: Launch the packaged apps
        env:
          REPORT_DIR: ${{ runner.temp }}/dist-smoke
        run: |
          smoke() { OPENMAIL_DIST_REPORT_DIR="$REPORT_DIR/$1" node scripts/smoke-dist.mjs "apps/desktop/release/$2/OpenMail.app"; }
          smoke arm64 mac-arm64
          smoke x64 mac

      # The screenshots and startup logs, also when a check fails.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-smoke
          path: ${{ runner.temp }}/dist-smoke
          if-no-files-found: ignore

      - name: Write SHA-256 checksums
        working-directory: apps/desktop/release
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.blockmap latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No build output in apps/desktop/release"; exit 1; fi
          shasum -a 256 "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Anyone can check a download against this workflow run with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: apps/desktop/release/SHA256SUMS

      - name: Upload to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.blockmap apps/desktop/release/latest-mac.yml apps/desktop/release/SHA256SUMS)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No build output in apps/desktop/release"; exit 1; fi
          flags=(--title "OpenMail ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag)
          if [ "$SIGNED" != "true" ]; then
            # gh puts these notes before the generated ones.
            flags+=(--prerelease --notes "This build is not signed or notarized. macOS Gatekeeper blocks it on first open. Open it once, then go to System Settings → Privacy & Security and click Open Anyway. Auto-update stays off for unsigned builds.")
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
