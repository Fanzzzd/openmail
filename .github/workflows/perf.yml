name: Performance

# The 100k-message budgets in docs/performance.md. Weekly and on demand, not on every push:
# the suite takes several minutes and shared runners are noisy.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  # Shared runners are slower and noisier than an idle laptop; budgets get twice the room.
  OPENMAIL_PERF_FACTOR: "2"
  OPENMAIL_PERF_REPORT: ${{ github.workspace }}/perf-report/openmail-performance.json
  OPENMAIL_SPARSE_PERF_REPORT: ${{ github.workspace }}/perf-report/openmail-around-sparse-performance.json
  OPENMAIL_SYNC_REPORT: ${{ github.workspace }}/perf-report/openmail-sync-performance.json

jobs:
  perf:
    # Same runner as check.yml: core uses macOS-only native modules.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.pnpm.outputs.store }}
            ~/Library/Caches/electron
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # The sync measurement loads core's built HTML worker from dist/.
      - run: pnpm --filter @openmail/core build

      # Node and node:sqlite only: no Electron window, display or network.
      - run: mkdir -p perf-report && pnpm test:perf

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: perf-report/
          if-no-files-found: warn
