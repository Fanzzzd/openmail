name: Performance

# The 100k-message budgets in docs/performance.md. Weekly, on demand, and before every release
# (release.yml calls it), not on every push: the suite takes several minutes and shared runners
# are noisy. Check runs the 10k seeding growth bound (seed-rate.test.ts) on every push; its
# absolute budget runs here.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  # Turns on the wall-clock budgets, including seed-rate.test.ts's absolute one.
  OPENMAIL_PERF: "1"
  # Shared runners are slower and noisier than an idle laptop; budgets get twice the room.
  OPENMAIL_PERF_FACTOR: "2"
  OPENMAIL_PERF_REPORT: ${{ github.workspace }}/perf-report/openmail-performance.json
  OPENMAIL_SPARSE_PERF_REPORT: ${{ github.workspace }}/perf-report/openmail-around-sparse-performance.json
  OPENMAIL_SYNC_REPORT: ${{ github.workspace }}/perf-report/openmail-sync-performance.json

jobs:
  perf:
    # Same runner as check.yml: core uses macOS-only native modules.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm.outputs.store }}
            ~/Library/Caches/electron
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # The sync measurement loads core's built HTML worker from dist/.
      - run: pnpm --filter @openmail/core build

      # Node and node:sqlite only: no Electron window, display or network.
      - run: mkdir -p perf-report && pnpm test:perf

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: perf-report/
          if-no-files-found: warn
