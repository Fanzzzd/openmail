name: Check

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks before it builds.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. A started run on main finishes.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  OPENMAIL_LOW_MEMORY_TESTS: "1"
  VITEST_MAX_WORKERS: "2"

jobs:
  check:
    # The desktop build compiles Swift helpers, and core uses macOS-only native modules.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in the next step; the store is cached below.
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm.outputs.store }}
            ~/Library/Caches/electron
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # turbo.json asks for the TUI; --ui=stream gives CI plain logs.
      - run: pnpm build --ui=stream
      - run: pnpm check-types --ui=stream
      - run: pnpm test --ui=stream --concurrency=1
      - run: pnpm exec oxlint
      - run: pnpm exec oxfmt --check .
