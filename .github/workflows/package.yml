name: Package

# Runs the packaging step the README gives (`pnpm --filter @openmail/desktop dist`), unsigned and
# with no secrets, then checks the arm64 app with scripts/smoke-dist.mjs: fuses, RunAsNode,
# `OpenMail --mcp` and the GUI start. release.yml does the same on tags, with signing.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/desktop/build/**
      - apps/desktop/electron-builder.config.cjs
      - apps/desktop/native/**
      - apps/desktop/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - scripts/smoke-dist.mjs
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in the next step; the store is cached below.
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm.outputs.store }}
            ~/Library/Caches/electron
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      # Icon Composer's actool compiles build/icon.icon and needs Xcode 26.
      - name: Select Xcode 26
        run: |
          xcode=""
          for app in /Applications/Xcode_26*.app; do [ -d "$app" ] && xcode="$app"; done
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq 'Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Packaging needs Xcode 26 or later"; exit 1; }

      - run: pnpm install --frozen-lockfile

      # No OAuth client or signing secret is in scope: the build is ad-hoc signed.
      - name: Build unsigned
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @openmail/desktop dist

      - name: Launch the packaged arm64 app
        env:
          OPENMAIL_DIST_REPORT_DIR: ${{ runner.temp }}/dist-smoke
        run: node scripts/smoke-dist.mjs apps/desktop/release/mac-arm64/OpenMail.app
