packages:
  - apps/*
  - packages/*
  # Tests that read source across packages; turbo.json lists the trees they read.
  - scripts/repo-checks
allowBuilds:
  # Electron 44 has no install script. apps/desktop's postinstall runs its install-electron bin,
  # which downloads the binary into node_modules/electron/dist and writes path.txt.
  electron: false
  # Squirrel.Windows helper from electron-builder; its postinstall downloads unused binaries.
  electron-winstaller: false
  esbuild: true
  # CPU N-API binaries ship in the package; skip optional CUDA downloads.
  onnxruntime-node: false
  protobufjs: false
catalog:
  typescript: ^5.9.3
# Electron patch releases carry Chromium security fixes. To take one before pnpm's release-age
# window ends, list it under minimumReleaseAgeExclude (for example `- electron@44.7.2`), and drop
# the entry once that version is older than the window.
overrides:
  # Effect packages ship in lockstep. @effect/platform-node 4.0.3 asks for
  # ^4.0.3 of this one, which resolves to 4.0.4 and needs effect 4.0.4.
  # Move it with the rest of the Effect family (docs/dependency-patches.md).
  "@effect/platform-node-shared": 4.0.3
  # @tailwindcss/node 4.3.3 pins lightningcss 1.32.0, which does not parse ::highlight() and
  # prints a false warning for each such rule in desktop and docs builds. 1.33.0 parses it.
  # Drop this when @tailwindcss/node depends on lightningcss 1.33 or later
  # (docs/dependency-patches.md).
  "@tailwindcss/node>lightningcss": 1.33.0
# Why each patch exists and when it can go: docs/dependency-patches.md
patchedDependencies:
  expo-background-task@57.0.21: patches/expo-background-task@57.0.21.patch
  expo-notifications@57.0.22: patches/expo-notifications@57.0.22.patch
  react-native-tcp-socket@6.4.3: patches/react-native-tcp-socket@6.4.3.patch
# Both macOS distributables need their N-API prebuilt optional dependencies.
supportedArchitectures:
  os: [current, darwin]
  cpu: [current, arm64, x64]
