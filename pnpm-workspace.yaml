packages:
  - apps/*
  - packages/*
allowBuilds:
  # Electron's postinstall downloads the binary the desktop shell runs on.
  electron: true
  # Squirrel.Windows helper from electron-builder; its postinstall downloads unused binaries.
  electron-winstaller: false
  esbuild: true
  # CPU N-API binaries ship in the package; skip optional CUDA downloads.
  onnxruntime-node: false
  protobufjs: false
catalog:
  typescript: ^5.9.3
overrides:
  # Effect packages ship in lockstep. @effect/platform-node 4.0.2 asks for
  # ^4.0.2 of this one, which resolves to 4.0.3 and needs effect 4.0.3.
  # Move it with the rest of the Effect family, or drop it on the next bump
  # (docs/dependency-patches.md).
  "@effect/platform-node-shared": 4.0.2
# Why each patch exists and when it can go: docs/dependency-patches.md
patchedDependencies:
  expo-background-task@57.0.21: patches/expo-background-task@57.0.21.patch
  expo-notifications@57.0.21: patches/expo-notifications@57.0.21.patch
  react-native-tcp-socket@6.4.3: patches/react-native-tcp-socket@6.4.3.patch
# Both macOS distributables need their N-API prebuilt optional dependencies.
supportedArchitectures:
  os: [current, darwin]
  cpu: [current, arm64, x64]
