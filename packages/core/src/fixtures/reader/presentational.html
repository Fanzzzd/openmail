<body link="#2255aa" vlink="#663399" alink="#aa2222" bgcolor="#ffffee" text="#223344">
  <main>
    <nav>Updates</nav>
    <aside>Member note</aside>
    <figure>
      <img
        src="data:image/jpg;base64,AQID"
        hspace="8"
        vspace="4"
        usemap="#navigation"
        width="320"
        height="80"
      />
      <map name="navigation" id="navigation"
        ><area shape="rect" coords="0,0,80,80" href=" https://news.example.test/ " alt="News"
      /></map>
      <figcaption>Member resources</figcaption>
    </figure>
    <font face="Georgia" size="4" color="#334455">A familiar typeface</font>
    <table rules="rows" frame="box">
      <colgroup span="2">
        <col span="2" />
      </colgroup>
      <tr>
        <td nowrap colspan="2" rowspan="1">Keep this label together</td>
      </tr>
    </table>
    <a name="reply" id="reply">Reply anchor</a>
    <p>
      <del>Old date</del><ins>New date</ins><small>Fine print</small><big>Headline</big>
      <tt>Monospace</tt><kbd>Enter</kbd><mark>Highlight</mark><abbr title="Quarter three">Q3</abbr>
      <cite>Annual report</cite><q>Quoted text</q><var>n</var><samp>Ready</samp
      ><dfn>Definition</dfn> <bdi dir="auto">Member</bdi><bdo dir="rtl">abc</bdo><wbr />
    </p>
    <details>
      <summary>Shipping details</summary>
      <p>Delivery is Friday.</p>
    </details>
    <noembed>Plugin fallback must not appear.</noembed
    ><noframes>Frame fallback must not appear.</noframes>
  </main>
</body>
