appId: app.openmail.desktop
productName: OpenMail

directories:
  # Icon masters and rendered icons live here (see build/render-icons.sh).
  buildResources: build
  output: release

# electron-vite output plus the manifest. Unlike plany, the main process keeps
# `@openmail/core` external (see electron.vite.config.ts), so electron-builder
# also copies the production dependency tree: @openmail/core and its runtime
# deps (@napi-rs/keyring, imapflow, mailparser, nodemailer). electron-builder 26
# walks pnpm's symlinked store for this itself.
files:
  - out/**
  - package.json

# node:sqlite ships inside Electron, and @napi-rs/keyring is N-API with a
# prebuilt per-platform package, so nothing needs rebuilding against
# Electron's ABI.
extraResources:
  - from: out/native
    to: native
    filter: ["vision"]

npmRebuild: false
asar: true
# dlopen cannot read from inside app.asar; the keychain binding's .node file
# must sit on disk in app.asar.unpacked.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/sqlite-vec-*/**"
  - "**/node_modules/@napi-rs/keyring-*/**"

# No `electronFuses:` block: flipping fuses rewrites the binary and breaks the
# ad-hoc signature, and macOS on Apple Silicon then kills the app on launch.
# Add fuses in the same change that adds a real Developer ID identity.

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Ad-hoc signature, no Apple Developer account needed. electron-builder breaks
  # Electron's own ad-hoc seal when it writes app.asar; signing again repairs it,
  # which turns "OpenMail is damaged" into the "Open Anyway" Gatekeeper prompt.
  identity: "-"
  # Must stay off while the signature is ad-hoc: library validation needs a Team
  # ID that ad-hoc frameworks do not have. Turn on together with a Developer ID.
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
