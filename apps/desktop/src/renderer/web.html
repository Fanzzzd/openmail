<!doctype html>
<html lang="en" data-platform="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome takes the app's surface colour (styles.css --surface). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171717" />
    <meta name="apple-mobile-web-app-title" content="OpenMail" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The Mac serves the same policy as a header, plus frame-ancestors 'none'.
         connect-src 'self' allows only this origin's RPC WebSocket. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: cid:; font-src 'self' data:; frame-src 'self' about:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>OpenMail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web.tsx"></script>
  </body>
</html>
