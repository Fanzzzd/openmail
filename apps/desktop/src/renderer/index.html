<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mail resources are upgraded to HTTPS before rendering. The iframe
         adds a stricter policy until the person allows remote images. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: cid:; font-src 'self' data:; frame-src 'self' about:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>OpenMail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
