<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- img-src allows https so a message can opt in to remote images; each
         message iframe adds a stricter policy of its own until then. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: cid:; font-src 'self' data:; frame-src 'self' about:"
    />
    <title>OpenMail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
