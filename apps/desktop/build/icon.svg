<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    OpenMail app icon master.
    Apple macOS icon grid: 1024 canvas, 824 body at (100,100), straight edges with superellipse (n=3.2, 260px corner span) continuous corners,
    drop shadow below the body. Render with build/render-icons.sh.
  -->
  <defs>
    <path id="body" d="M664 100L717 100.5L745.6 102L768.7 104.5L788.8 108L806.6 112.6L822.7 118.1L837.3 124.7L850.5 132.3L862.5 140.9L873.4 150.6L883.1 161.5L891.7 173.5L899.3 186.7L905.9 201.3L911.4 217.4L916 235.2L919.5 255.3L922 278.4L923.5 307L924 360L924 664L923.5 717L922 745.6L919.5 768.7L916 788.8L911.4 806.6L905.9 822.7L899.3 837.3L891.7 850.5L883.1 862.5L873.4 873.4L862.5 883.1L850.5 891.7L837.3 899.3L822.7 905.9L806.6 911.4L788.8 916L768.7 919.5L745.6 922L717 923.5L664 924L360 924L307 923.5L278.4 922L255.3 919.5L235.2 916L217.4 911.4L201.3 905.9L186.7 899.3L173.5 891.7L161.5 883.1L150.6 873.4L140.9 862.5L132.3 850.5L124.7 837.3L118.1 822.7L112.6 806.6L108 788.8L104.5 768.7L102 745.6L100.5 717L100 664L100 360L100.5 307L102 278.4L104.5 255.3L108 235.2L112.6 217.4L118.1 201.3L124.7 186.7L132.3 173.5L140.9 161.5L150.6 150.6L161.5 140.9L173.5 132.3L186.7 124.7L201.3 118.1L217.4 112.6L235.2 108L255.3 104.5L278.4 102L307 100.5L360 100Z"/>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A6CF2"/>
      <stop offset="1" stop-color="#1A3DB4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="300" x2="0" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F6"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="340" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="1" stop-color="#E3E7EE"/>
    </linearGradient>
    <!-- Airmail stripe: red, gap, blue, gap; rotated 45 degrees. x offset puts
         the stripes so the envelope corners do not end in a sliver. -->
    <pattern id="airmail" x="78.5" width="112" height="112" patternUnits="userSpaceOnUse" patternTransform="rotate(45 512 512)">
      <rect width="112" height="112" fill="#FFFFFF"/>
      <rect x="0" width="38" height="112" fill="#D23A3A"/>
      <rect x="56" width="38" height="112" fill="#1F4FD1"/>
    </pattern>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="envShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
      </defs>

  <g filter="url(#iconShadow)">
    <use href="#body" fill="url(#bg)"/>
  </g>
  <use href="#body" fill="url(#sheen)"/>

  <g filter="url(#envShadow)">
    <!-- Envelope: white rim keeps the silhouette crisp against the blue body,
         then the airmail stripe band, then the paper. -->
    <rect x="215" y="302" width="594" height="436" rx="40" fill="#FFFFFF"/>
    <rect x="229" y="316" width="566" height="408" rx="28" fill="url(#airmail)"/>
    <rect x="263" y="350" width="498" height="340" rx="6" fill="url(#paper)"/>
  </g>
  <!-- Flap -->
  <path d="M263 356 L512 545 L761 356 L761 350 L263 350 Z" fill="url(#flap)"/>
  <path d="M269 356 L512 540 L755 356" fill="none" stroke="#C3CAD6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
